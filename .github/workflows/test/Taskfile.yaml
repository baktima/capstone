version: "3"

# generate git auth token
env:
  GITHUB_TOKEN: 
    sh: gh auth token

tasks:
  act-trigger-workflow:
    desc: Trigger the test workflow locally
    cmds:
      - |
        act workflow_dispatch \
          --container-architecture linux/amd64 \
          -s GITHUB_TOKEN={{.GITHUB_TOKEN}} \
          -e {{.PWD}}/event.json \
          -P ubuntu-24.04=catthehacker/ubuntu:act-22.04 \
          --directory ../../../ \
          -W .github/workflows/test.yaml